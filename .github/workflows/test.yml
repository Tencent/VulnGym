name: VulnGym T1 CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      
      - name: Run pytest
        run: python -m pytest tests/ -v
      
      - name: Smoke test
        run: |
          PYTHONPATH=vulngym-verify-demo python -m vulngym_verify_demo \
            --entries vulngym-verify-demo/public_fixtures/entries.jsonl \
            --repo-cache vulngym-verify-demo/mock_repo \
            --advisories vulngym-verify-demo/mock_advisories \
            --manifest vulngym-verify-demo/mock_repo/manifest.json \
            --out /tmp/reports_ci.jsonl \
            --llm mock
          test "$(wc -l < /tmp/reports_ci.jsonl)" -eq 11
